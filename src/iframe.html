<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- <script src="./iframe-script.js" defer></script> -->
		<title>Sandbox</title>
	</head>
	<body></body>

	<script>
		window.addEventListener("message", (e) => {
			const message = e.data;

			if (message.type === "RUN_CODE") {
				try {
					const execute = new Function(message.code);
					execute();

					// eval(message.code);

					window.parent.postMessage(
						{
							type: "EXECUTION_STATUS",
							status: "success",
						},
						"*",
					);

					// console.log("Code Executed!");
				} catch (error) {
					// console.log("Name:", error.name);
					// console.log("Message:", error.message);
					// console.log("Stack:", error.stack);
					// console.log("Line:", error.lineNumber);
					// console.log("Column:", error.columnNumber);

					const match = error.stack.match(/<anonymous>:(\d+):(\d+)/);

					let location = "";
					if (match) {
						const line = Number(match[1] - 2);
						const column = Number(match[2]);

						location = ` (Line ${line}, Column ${column})`;
					}

					console.error(
						`${error.name} : ${error.message}${location}`,
					);
					// console.log(error.stack);

					window.parent.postMessage(
						{
							type: "EXECUTION_STATUS",
							status: "error",
						},
						"*",
					);
				}
			}
		});

		function sendConsoleMessage(method, args) {
			window.parent.postMessage(
				{
					type: "CONSOLE_OUTPUT",
					method: method,
					args: args,
				},
				"*",
			);
		}
		// Testing Code Start

		// Testing code Ends

		function serializeValue(val) {
			if (typeof val === "function") {
				return { type: "function", name: val.name };
			} else if (typeof val === "symbol") {
				return { type: "symbol", description: val.description };
			} else if (Array.isArray(val)) {
				return val.map(serializeValue);
			} else if (val instanceof Date || val instanceof RegExp) {
				return val;
			} else if (val instanceof Map) {
				const mapEntries = Array.from(val.entries()).map(
					([key, value]) => [
						serializeValue(key),
						serializeValue(value),
					],
				);
				return { type: "map", entries: mapEntries };
			} else if (val instanceof Set) {
				const setValues = Array.from(val.values()).map((value) =>
					serializeValue(value),
				);
				return { type: "set", values: setValues };
			} else if (val instanceof Error) {
				return {
					type: "error",
					name: val.name,
					message: val.message,
					stack: val.stack,
				};
			} else if (typeof val === "object" && val !== null) {
				const entries = Object.entries(val).map(([key, value]) => {
					return [key, serializeValue(value)];
				});
				return Object.fromEntries(entries);
			} else {
				return val;
			}
		}

		console.log = (...args) =>
			sendConsoleMessage("log", args.map(serializeValue));
		console.warn = (...args) => sendConsoleMessage("warn", args);
		console.error = (...args) => sendConsoleMessage("error", args);

		// Temp code below For Testing
	</script>
</html>
