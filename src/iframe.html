<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox</title>
</head>
<body>
    <script>
        window.addEventListener("message", (event) => {
            console.log(event.data);

            window.parent.postMessage(
                'Message received by iframe',
                '*'
            )
        });

        
    </script>
</body>
</html>
