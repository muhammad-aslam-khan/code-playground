<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="stylesheet" href="./style.css" />
		<link rel="stylesheet" href="./src/styles/explorer.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="https://cdn.jsdelivr.net/npm/acorn/dist/acorn.js"></script>

		<!-- Fallback for legacy browsers -->
		<link rel="icon" href="./src/code-icon.svg" sizes="32x32" />
		<!-- Modern SVG favicon -->
		<link rel="icon" href="./src/code-icon.svg" type="image/svg+xml" />
		<!-- iOS home screen icon -->
		<link rel="apple-touch-icon" href="./src/code-icon.svg" />

		<!-- Google fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
			rel="stylesheet"
		/>

		<title>Code Playground</title>
	</head>
	<body>
		<header id="app-header">
			<h1>Code Playground</h1>

			<div id="toolbar">
				<div id="view-controls">
					<button id="toggle-explorer-btn" type="button">
						Hide Explorer
					</button>

					<button id="toggle-workspace-btn" type="button">
						Hide Workspace
					</button>

					<button id="toggle-preview-btn" type="button">
						Hide Preview
					</button>

					<button id="toggle-console-btn" type="button">
						Hide Console
					</button>
				</div>

				<div id="action-controls">
					<select id="execution-mode">
						<option value="javascript">JavaScript</option>
						<option value="project" selected>Web Project</option>
					</select>

					<button id="run-btn" type="button">Run</button>
					<button id="clr-editor-btn" type="button">
						Clear Editor
					</button>
					<!-- <button id="clr-console-btn" type="button">
						Clear Console
					</button> -->
				</div>
			</div>
		</header>

		<main id="workspace">
			<!-- Left workspace -->
			<section id="left-panel">
				<!-- File Explorer -->
				<aside id="file-explorer">
					<div id="explorer-header">
						<h3>Explorer</h3>
						<div id="explorer-actions">
							<button
								id="new-file-btn"
								type="button"
								title="New File"
							>
								+
							</button>
							<button
								id="new-folder-btn"
								type="button"
								title="New Folder"
							>
								📁
							</button>
						</div>
					</div>

					<div id="file-tree"></div>
				</aside>

				<!-- Explorer Divider -->
				<div id="explorer-divider"></div>

				<!-- Editor -->
				<section id="editor-panel">
					<div id="editor-tabs"></div>

					<div id="editor-welcome">
						<h2>Welcome to Code Playground</h2>
						<p>Select a file from Explorer to start editing.</p>
					</div>

					<div id="code-editor" class="hidden"></div>
				</section>
			</section>

			<!-- Editor / Preview Divider -->
			<div id="main-divider"></div>

			<!-- Right workspace: Preview only -->
			<section id="right-panel">
				<section id="preview-panel">
					<h3>Preview</h3>
					<iframe
						id="preview-frame"
						title="Live Preview"
						sandbox="allow-scripts"
					></iframe>
				</section>
			</section>
		</main>

		<!-- Workspace / Console Divider -->
		<div id="workspace-console-divider"></div>

		<!-- Bottom Console -->
		<section id="console-panel">
			<div id="console-header">
				<h3>Console Output</h3>
				<button id="clr-console-btn" type="button">Clear</button>
			</div>

			<div id="code-output"></div>
		</section>

		<iframe
			id="execution-frame"
			src="./src/iframe.html"
			sandbox="allow-scripts"
			referrerpolicy="no-referrer"
			hidden
		></iframe>

		<script type="module" src="./script.js"></script>
	</body>
</html>
