<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="stylesheet" href="./src/style.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="https://cdn.jsdelivr.net/npm/acorn/dist/acorn.js"></script>
		<script src="./src/script.js" defer></script>
		<title>Code Playground</title>
	</head>
	<body>
		<h1>Code Playground</h1>
		<div id="input-side">
			<h3>Your code</h3>
			<button type="button" id="run-btn">Run</button>
			<button type="button" id="clr-console-btn">Clear Output</button>
			<button type="button" id="clr-editor-btn">Clear Editor</button>
			<label for="code-editor">JavaScript</label>
			<textarea id="code-editor"></textarea>
		</div>
		<h3>Console Output</h3>
		<div id="code-output"></div>
		<iframe
			src="./src/iframe.html"
			sandbox="allow-scripts"
			referrerpolicy="no-referrer"
		></iframe>

		<!-- <button id="sMsgBtn" type="button">Send Message</button> -->
	</body>
