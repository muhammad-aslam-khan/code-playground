<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Playground</title>
</head>
<body>
<h1>Code Playground</h1>
        <div id="input-side">
            <h3>Your code</h3>
            <button type="button">Run</button>
            <label for="code-input">JavaScript</label>
            <textarea id="code-input"></textarea>

        </div>
        <h3>Console Output</h3>
        <div id="code-output"></div>
        <iframe src="./src/iframe.html" sandbox="allow-scripts"></iframe>

        <button id='sMsgBtn' type="button">Send Message</button>
        <script>
            const iframe = document.getElementsByTagName('iframe')[0]
            const sMsgBtn = document.getElementById('sMsgBtn')
            const codeOutput = document.getElementById('code-output')

            sMsgBtn.addEventListener('click', () => {
                iframe.contentWindow.postMessage(
                    "Hello from parent",
                    "*"
                )
            })

            window.addEventListener("message", (event) => {
                codeOutput.textContent = event.data 
            });
        </script>
</body>
</html>
